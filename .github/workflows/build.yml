name: Build and typecheck
on:
  push:
    branches: [main, feature/v0.1-dungeon, feature/v0.2-battle-cinematics]
  pull_request:
    branches: [main, feature/v0.1-dungeon]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
